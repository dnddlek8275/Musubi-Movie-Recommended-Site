services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cineverse
      POSTGRES_USER: cineverse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cineverse -d cineverse"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  migrate:
    build:
      context: ./Backend
    command: ["alembic", "upgrade", "head"]
    environment: &backend-environment
      DATABASE_URL: postgresql+psycopg://cineverse:${POSTGRES_PASSWORD:-local-only-password}@db:5432/cineverse
      SECRET_KEY: ${SECRET_KEY:-local-development-secret-change-me}
      AI_BASE_URL: ${AI_BASE_URL:-http://210.109.15.251}
      CORS_ORIGINS: http://localhost:8088
      REFRESH_COOKIE_PATH: /api/auth
      REFRESH_COOKIE_SECURE: "false"
      MAIL_HOST: ${MAIL_HOST:-smtp.example.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-local@example.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-local-only-password}
      MAIL_FROM: ${MAIL_FROM:-local@example.com}
      FRONTEND_BASE_URL: http://localhost:8088
      PASSWORD_RESET_EXPIRE_MINUTES: "30"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./Backend
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
    volumes:
      - backend-uploads:/app/app/uploads
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8088:80"
    restart: unless-stopped

volumes:
  postgres-data:
  backend-uploads:
