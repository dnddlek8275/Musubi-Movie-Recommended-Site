[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# 실제 접속 주소는 alembic/env.py가 DATABASE_URL 환경변수에서 설정합니다.
sqlalchemy.url = postgresql+psycopg://postgres:your-database-password@localhost:5432/cineverse

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
