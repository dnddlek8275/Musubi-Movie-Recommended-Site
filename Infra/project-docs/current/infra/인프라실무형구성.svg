  <path class="line" d="M705 520 C790 520,810 520,895 520"/>
  <path class="line" d="M705 635 C790 635,810 635,895 635"/>
  <path class="line" d="M705 635 C910 710,1100 710,1190 635"/>
  <text x="800" y="890" text-anchor="middle" class="small">인터넷 공개: Public Load Balancer 80/443만 · SSH: AZ별 NAT+Bastion 경유 · DB/GPU/Worker: Private subnet</text>
  <text x="800" y="944" text-anchor="middle" class="sub">현재 5 VM과 최종 목표 10 VM을 문서에서 구분해 관리</text>
