apiVersion: v1
kind: Secret
metadata:
  name: cineverse-secrets
  namespace: cineverse
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://USER:PASSWORD@db.internal:6432/cineverse
  SECRET_KEY: REPLACE_WITH_LONG_RANDOM_VALUE
  TMDB_ACCESS_TOKEN: REPLACE_WITH_TMDB_ACCESS_TOKEN
  KOBIS_API_KEY: REPLACE_WITH_KOBIS_API_KEY
  AI_SYNC_TOKEN: REPLACE_WITH_SHARED_RANDOM_SYNC_TOKEN
  OBJECT_STORAGE_ACCESS_KEY: REPLACE_WITH_S3_ACCESS_KEY
  OBJECT_STORAGE_SECRET_KEY: REPLACE_WITH_S3_SECRET_ACCESS_KEY
  MAIL_HOST: REPLACE_WITH_SMTP_HOST
  MAIL_PORT: "587"
  MAIL_USERNAME: REPLACE_WITH_SMTP_USERNAME
  MAIL_PASSWORD: REPLACE_WITH_SMTP_PASSWORD
  MAIL_FROM: REPLACE_WITH_SMTP_FROM_ADDRESS
---
apiVersion: v1
kind: Secret
metadata:
  name: cineverse-migration-secrets
  namespace: cineverse
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://USER:PASSWORD@db.internal:5432/cineverse
  SECRET_KEY: REPLACE_WITH_LONG_RANDOM_VALUE
  TMDB_ACCESS_TOKEN: REPLACE_WITH_TMDB_ACCESS_TOKEN
  MAIL_HOST: REPLACE_WITH_SMTP_HOST
  MAIL_PORT: "587"
  MAIL_USERNAME: REPLACE_WITH_SMTP_USERNAME
  MAIL_PASSWORD: REPLACE_WITH_SMTP_PASSWORD
  MAIL_FROM: REPLACE_WITH_SMTP_FROM_ADDRESS
