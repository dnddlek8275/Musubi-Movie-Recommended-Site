apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cineverse-frontend
  namespace: cineverse
  annotations:
    nginx.ingress.kubernetes.io/server-alias: www.movieverse.cloud
spec:
  ingressClassName: nginx
  rules:
    - host: movieverse.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cineverse-backend
  namespace: cineverse
  annotations:
    nginx.ingress.kubernetes.io/server-alias: www.movieverse.cloud
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-body-size: 20m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: movieverse.cloud
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend
                port:
                  name: http
