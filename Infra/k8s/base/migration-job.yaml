apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migration
  namespace: cineverse
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-migration
        app.kubernetes.io/part-of: cineverse
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: registry.example.com/cineverse/backend:dev
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - >-
              python -m app.ops.migration_preflight --phase before
              && alembic upgrade head
              && python -m app.ops.migration_preflight --phase after
          envFrom:
            - configMapRef:
                name: cineverse-config
            - secretRef:
                name: cineverse-migration-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
