apiVersion: batch/v1
kind: Job
metadata:
  name: backend-vector-sync
  namespace: cineverse
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-vector-sync
        app.kubernetes.io/part-of: cineverse
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: kcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sync
          image: kc-sfacspace05.kr-central-2.kcr.dev/team3-back-repo/backend:20260810-1
          imagePullPolicy: IfNotPresent
          command: ["python", "scripts/dispatch_movie_vectors.py"]
          envFrom:
            - configMapRef:
                name: cineverse-config
            - secretRef:
                name: cineverse-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
